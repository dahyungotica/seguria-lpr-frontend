<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1120" />
  <title>Mi perfil · SegurIA-LPR</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body class="app">
  <!-- El sidebar y el header los genera js/layout.js según el rol -->
  <div class="app-main">
    <main class="contenido perfil-grid">
      <!-- Perfiles: recintos y roles con los que puede entrar -->
      <section class="tarjeta perfil-roles-tarjeta" id="roles">
        <div class="seccion-cabecera">
          <div>
            <h2>Mis recintos y roles</h2>
            <p id="descripcion-roles">Con una sola cuenta puedes entrar con cualquiera de estos perfiles.</p>
          </div>
          <button type="button" class="btn btn-primario oculto" id="btn-editar-roles">Editar mis roles</button>
        </div>
        <div class="lista-recintos" id="lista-perfiles" role="list"></div>
      </section>

      <section class="tarjeta">
        <div class="seccion-cabecera">
          <div>
            <h2>Mis datos</h2>
            <p>Se usan en todos tus recintos.</p>
          </div>
        </div>
        <form id="form-datos" novalidate>
          <div class="alerta alerta-error oculto" role="alert" data-error></div>
          <div class="form-grid" id="campos-datos"></div>
          <div class="acciones-formulario">
            <button type="submit" class="btn btn-primario">Guardar datos</button>
          </div>
        </form>
      </section>

      <section class="tarjeta">
        <div class="seccion-cabecera">
          <div>
            <h2>Cambiar contraseña</h2>
            <p>Mínimo 8 caracteres, con letras y números.</p>
          </div>
        </div>
        <form id="form-password" novalidate>
          <div class="alerta alerta-error oculto" role="alert" data-error></div>
          <div class="form-grid">
            <div class="campo completo">
              <label for="campo-password_actual">Contraseña actual <span class="obligatorio" aria-hidden="true">*</span></label>
              <input class="input" id="campo-password_actual" name="password_actual" type="password" autocomplete="current-password" />
              <span class="texto-error-campo"></span>
            </div>
            <div class="campo">
              <label for="campo-password">Nueva contraseña <span class="obligatorio" aria-hidden="true">*</span></label>
              <input class="input" id="campo-password" name="password" type="password" autocomplete="new-password" />
              <span class="texto-error-campo"></span>
            </div>
            <div class="campo">
              <label for="campo-confirmar">Repite la nueva contraseña <span class="obligatorio" aria-hidden="true">*</span></label>
              <input class="input" id="campo-confirmar" name="confirmar" type="password" autocomplete="new-password" />
              <span class="texto-error-campo"></span>
            </div>
          </div>
          <div class="acciones-formulario">
            <button type="submit" class="btn btn-primario">Cambiar contraseña</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/usuarios-form.js"></script>
  <script src="../js/pages/perfil.js"></script>
</body>
</html>
