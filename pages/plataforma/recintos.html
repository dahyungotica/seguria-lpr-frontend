<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1120" />
  <title>Recintos · SegurIA-LPR</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body class="app">
  <!-- El sidebar y el header los genera js/layout.js según el rol -->
  <div class="app-main">
    <main class="contenido">
      <section class="tarjeta">
        <div class="seccion-cabecera">
          <div>
            <h2>Recintos de la plataforma</h2>
            <p>Condominios, empresas y estacionamientos que usan SegurIA-LPR.</p>
          </div>
          <button type="button" class="btn btn-primario" id="btn-nuevo">+ Nuevo recinto</button>
        </div>

        <div class="barra-filtros">
          <div class="campo campo-busqueda">
            <label for="filtro-busqueda">Buscar</label>
            <input class="input" type="search" id="filtro-busqueda" placeholder="Nombre o comuna" />
          </div>
          <div class="campo">
            <label for="filtro-estado">Estado</label>
            <select class="input" id="filtro-estado">
              <option value="">Todos</option>
              <option value="true">Activos</option>
              <option value="false">Inactivos</option>
            </select>
          </div>
        </div>

        <div class="tabla-contenedor">
          <table class="tabla">
            <thead>
              <tr>
                <th>Recinto</th>
                <th>Tipo</th>
                <th>Ubicación</th>
                <th class="num">Admins</th>
                <th class="num">Propietarios</th>
                <th class="num">Cámaras</th>
                <th>Estado</th>
                <th><span class="sr-only">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="tabla-recintos"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/pages/plataforma-recintos.js"></script>
</body>
</html>
