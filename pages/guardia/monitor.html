<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1120" />
  <title>Monitor en vivo · SegurIA-LPR</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body class="app">
  <!-- El sidebar y el header los genera js/layout.js según el rol -->
  <div class="app-main">
    <main class="contenido">
      <div class="monitor">
        <!-- Columna principal: captura siempre visible + detección -->
        <section class="tarjeta monitor-captura">
          <div class="monitor-cabecera">
            <h2 id="captura-titulo">Captura de la cámara</h2>
            <div class="campo" style="margin:0">
              <label for="filtro-camara" class="sr-only">Cámara</label>
              <select class="input" id="filtro-camara"><option value="">Todas las cámaras</option></select>
            </div>
          </div>

          <!-- La captura siempre está visible; se puede ampliar con el zoom -->
          <div class="captura" id="captura" title="Clic para centrar el zoom en ese punto">
            <img id="captura-imagen" class="oculto" alt="Última captura de la cámara" />
            <div class="placeholder" id="captura-vacia">
              <strong>Esperando detección…</strong>
              <span>La captura aparecerá aquí en tiempo real.</span>
            </div>
          </div>

          <div class="zoom-control">
            <label for="zoom">Zoom</label>
            <input type="range" id="zoom" min="1" max="4" step="0.5" value="1" />
            <span id="zoom-valor">1x</span>
          </div>

          <div class="deteccion-actual" id="deteccion-actual" aria-live="polite">
            <p class="texto-suave" style="margin:0">Aún no hay detecciones.</p>
          </div>
        </section>

        <!-- Columna lateral: detecciones recientes y visitas de hoy -->
        <div class="monitor-lateral">
          <section class="tarjeta">
            <h2>Detecciones recientes</h2>
            <ul class="lista-detecciones" id="lista-detecciones"></ul>
          </section>
          <section class="tarjeta">
            <h2>Visitas de hoy</h2>
            <ul class="lista-estado" id="lista-visitas"></ul>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="../../js/socket.js"></script>
  <script src="../../js/autorizacion.js"></script>
  <script src="../../js/pages/guardia-monitor.js"></script>
</body>
</html>
