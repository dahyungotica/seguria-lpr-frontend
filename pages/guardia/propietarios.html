<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1120" />
  <title>Propietarios · SegurIA-LPR</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body class="app">
  <!-- El sidebar y el header los genera js/layout.js según el rol -->
  <div class="app-main">
    <main class="contenido">
      <section class="tarjeta">
        <div class="seccion-cabecera">
          <div>
            <h2>Propietarios del recinto</h2>
            <p>Consulta de residentes, sus unidades y vehículos autorizados (solo lectura).</p>
          </div>
        </div>

        <div class="barra-filtros">
          <div class="campo campo-busqueda">
            <label for="filtro-busqueda">Buscar</label>
            <input class="input" type="search" id="filtro-busqueda" placeholder="Nombre, unidad, RUT o patente" autocomplete="off" />
          </div>
        </div>

        <div class="tabla-contenedor">
          <table class="tabla">
            <thead>
              <tr>
                <th>Propietario</th>
                <th>Unidad</th>
                <th>Contacto</th>
                <th>Vehículos</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-propietarios"></tbody>
          </table>
        </div>
        <div class="paginacion" id="paginacion"></div>
      </section>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/pages/guardia-propietarios.js"></script>
</body>
</html>
