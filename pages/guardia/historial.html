<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1120" />
  <title>Historial de accesos · SegurIA-LPR</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body class="app" data-rol="guardia" data-activo="historial">
  <!-- El sidebar y el header los genera js/layout.js según el rol -->
  <div class="app-main">
    <main class="contenido">
      <section class="tarjeta">
        <form class="barra-filtros" id="form-filtros">
          <div class="campo">
            <label for="filtro-recinto">Recinto</label>
            <select class="input" id="filtro-recinto" name="recinto_id"><option value="">Todos</option></select>
          </div>
          <div class="campo">
            <label for="filtro-desde">Desde</label>
            <input class="input" type="date" id="filtro-desde" name="desde" />
          </div>
          <div class="campo">
            <label for="filtro-hasta">Hasta</label>
            <input class="input" type="date" id="filtro-hasta" name="hasta" />
          </div>
          <div class="campo">
            <label for="filtro-patente">Patente</label>
            <input class="input" type="search" id="filtro-patente" name="patente" maxlength="10" placeholder="ABCD12" autocomplete="off" />
          </div>
          <div class="campo">
            <label for="filtro-resultado">Resultado</label>
            <select class="input" id="filtro-resultado" name="resultado">
              <option value="">Todos</option>
              <option value="autorizado">Autorizado</option>
              <option value="visita">Visita</option>
              <option value="autorizado_manual">Autorizado manual</option>
              <option value="denegado">Denegado</option>
            </select>
          </div>
          <div class="campo">
            <label for="filtro-alerta">Alerta</label>
            <select class="input" id="filtro-alerta" name="alerta">
              <option value="">Todas</option>
              <option value="pendiente">Pendientes</option>
              <option value="atendida">Atendidas</option>
            </select>
          </div>
          <div class="campo">
            <label for="filtro-camara">Cámara</label>
            <select class="input" id="filtro-camara" name="camara_id"><option value="">Todas</option></select>
          </div>
          <div class="campo">
            <label for="filtro-sentido">Sentido</label>
            <select class="input" id="filtro-sentido" name="sentido">
              <option value="">Ambos</option>
              <option value="entrada">Entrada</option>
              <option value="salida">Salida</option>
            </select>
          </div>
          <button type="reset" class="btn btn-secundario" id="btn-limpiar">Limpiar</button>
        </form>

        <div class="tabla-contenedor">
          <table class="tabla">
            <thead>
              <tr>
                <th>Fecha y hora</th>
                <th>Captura</th>
                <th>Patente</th>
                <th>Resultado</th>
                <th>Asociado a</th>
                <th>Cámara</th>
                <th class="num">Confianza</th>
              </tr>
            </thead>
            <tbody id="tabla-accesos"></tbody>
          </table>
        </div>
        <div class="paginacion" id="paginacion"></div>
      </section>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/autorizacion.js"></script>
  <script src="../../js/pages/historial.js"></script>
</body>
</html>
