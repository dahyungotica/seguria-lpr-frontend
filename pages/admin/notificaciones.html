<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1120" />
  <title>Notificación de cambios · SegurIA-LPR</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body class="app">
  <!-- El sidebar y el header los genera js/layout.js según el rol -->
  <div class="app-main">
    <main class="contenido">
      <section class="tarjeta">
        <div class="seccion-cabecera">
          <div>
            <h2>Notificación de cambios</h2>
            <p>Cambios que hacen los propietarios en sus vehículos y avisos del sistema, en tiempo real.</p>
          </div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            <a class="btn btn-secundario" href="auditoria.html">Ver auditoría</a>
            <button type="button" class="btn btn-secundario" id="btn-leer-todas">Marcar todas como leídas</button>
          </div>
        </div>

        <div class="pestanas" role="tablist" aria-label="Filtrar notificaciones">
          <button type="button" class="pestana" role="tab" data-filtro="" aria-selected="true">Todas</button>
          <button type="button" class="pestana" role="tab" data-filtro="false">No leídas <span class="contador" id="contador-no-leidas">0</span></button>
        </div>

        <ul class="lista-notificaciones" id="lista-notificaciones" aria-live="polite"></ul>
        <div class="paginacion" id="paginacion"></div>
      </section>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="../../js/socket.js"></script>
  <script src="../../js/pages/admin-notificaciones.js"></script>
</body>
</html>
