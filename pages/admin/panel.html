<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1120" />
  <title>Panel · SegurIA-LPR</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body class="app">
  <!-- El sidebar y el header los genera js/layout.js según el rol -->
  <div class="app-main">
    <main class="contenido">
      <p class="texto-suave" id="recinto-nombre" style="margin-top:0"></p>

      <!-- Accesos de hoy -->
      <div class="indicadores" id="indicadores-hoy" aria-live="polite"></div>

      <div class="panel-grilla">
        <section class="tarjeta">
          <div class="seccion-cabecera">
            <div>
              <h2>Accesos de los últimos 7 días</h2>
              <p>Total de detecciones por día.</p>
            </div>
          </div>
          <div id="grafico-dias"></div>
        </section>

        <section class="tarjeta">
          <h2>Recinto</h2>
          <ul class="lista-estado" id="resumen-recinto"></ul>
        </section>
      </div>

      <div class="panel-grilla">
        <section class="tarjeta">
          <div class="seccion-cabecera">
            <div>
              <h2>Últimas detecciones</h2>
              <p>Se actualiza en tiempo real.</p>
            </div>
            <a class="btn btn-secundario btn-sm" href="historial.html">Ver historial</a>
          </div>
          <div class="tabla-contenedor">
            <table class="tabla">
              <thead>
                <tr><th>Hora</th><th>Patente</th><th>Resultado</th><th>Asociado a</th></tr>
              </thead>
              <tbody id="tabla-ultimos"></tbody>
            </table>
          </div>
        </section>

        <section class="tarjeta">
          <div class="seccion-cabecera">
            <h2>Cámaras y equipos</h2>
            <a class="btn btn-secundario btn-sm" href="camaras.html">Gestionar</a>
          </div>
          <ul class="lista-estado" id="estado-equipos"></ul>
        </section>
      </div>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="../../js/socket.js"></script>
  <script src="../../js/pages/admin-panel.js"></script>
</body>
</html>
