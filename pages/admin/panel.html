<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1120" />
  <title>Panel · SegurIA-LPR</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
</head>
<body class="app">
  <!-- El sidebar y el header los genera js/layout.js según el rol -->
  <div class="app-main">
    <main class="contenido">
        <section class="tarjeta">
          <h2>Panel <span class="etiqueta pendiente">En construcción</span></h2>
          <p class="texto-suave">Resumen de la actividad del recinto.</p>
        </section>

        <section class="tarjeta">
          <h2>Funcionalidades previstas</h2>
          <ul class="texto-suave">
            <li>Accesos del día (autorizados, denegados, manuales y visitas)</li>
            <li>Últimas detecciones en tiempo real</li>
            <li>Estado de cámaras y equipos Raspberry Pi</li>
          </ul>
        </section>

        <section class="tarjeta">
          <h2>Eventos en tiempo real</h2>
          <ul class="lista-eventos" id="lista-eventos">
            <li class="texto-suave">Esperando eventos…</li>
          </ul>
        </section>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="../../js/socket.js"></script>
  <script>
    const usuario = iniciarPagina({ roles: ['admin_recinto'], activo: 'panel', titulo: 'Panel' });
    if (usuario) {
      // TODO: cargar los datos de esta sección con api.get(...)

      const socket = conectarSocket();
      const lista = document.getElementById('lista-eventos');

      // Muestra cada evento recibido (placeholder hasta implementar el módulo)
      function agregarEvento(nombre, datos) {
        if (lista.querySelector('.texto-suave')) lista.innerHTML = '';
        const item = document.createElement('li');
        item.textContent = new Date().toLocaleTimeString('es-CL') + ' · ' + nombre + ' · ' + JSON.stringify(datos);
        lista.prepend(item);
      }

      if (socket) {
        socket.on('acceso:nuevo', (datos) => agregarEvento('acceso:nuevo', datos));
        socket.on('vehiculo:cambio', (datos) => agregarEvento('vehiculo:cambio', datos));
      }
    }
  </script>
</body>
</html>
