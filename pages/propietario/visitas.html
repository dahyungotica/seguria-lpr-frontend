<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1120" />
  <title>Mis visitas · SegurIA-LPR</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body class="app">
  <!-- El sidebar y el header los genera js/layout.js según el rol -->
  <div class="app-main">
    <main class="contenido">
      <section class="tarjeta">
        <div class="seccion-cabecera">
          <div>
            <h2>Mis visitas</h2>
            <p>Si indicas la patente, el vehículo de tu visita podrá ingresar solo durante el horario programado.</p>
          </div>
          <button type="button" class="btn btn-primario" id="btn-nueva">+ Programar visita</button>
        </div>

        <div class="pestanas" role="tablist" aria-label="Filtrar visitas">
          <button type="button" class="pestana" role="tab" data-vigencia="proximas" aria-selected="true">Próximas y en curso</button>
          <button type="button" class="pestana" role="tab" data-vigencia="pasadas" aria-selected="false">Pasadas y canceladas</button>
        </div>

        <div class="tabla-contenedor">
          <table class="tabla">
            <thead>
              <tr>
                <th>Visitante</th>
                <th>Patente</th>
                <th>Horario</th>
                <th>Motivo</th>
                <th>Estado</th>
                <th><span class="sr-only">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="tabla-visitas"></tbody>
          </table>
        </div>
        <div class="paginacion" id="paginacion"></div>
      </section>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/pages/propietario-visitas.js"></script>
</body>
</html>
