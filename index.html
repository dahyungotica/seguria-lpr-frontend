<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SegurIA-LPR: control de acceso vehicular por reconocimiento de patentes" />
  <meta name="theme-color" content="#0a1120" />
  <title>Iniciar sesión · SegurIA-LPR</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-body">
  <main class="login-contenedor">
    <div class="login-marca">
      <img src="assets/logo.svg" alt="" />
      <h1>SegurIA<span>-LPR</span></h1>
      <p>Control de acceso vehicular inteligente</p>
    </div>

    <section class="login-tarjeta" aria-labelledby="titulo-login">
      <h2 id="titulo-login">Iniciar sesión</h2>

      <div id="login-error" class="alerta alerta-error oculto" role="alert"></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input class="input" type="email" id="email" name="email" autocomplete="username"
                 placeholder="nombre@correo.cl" required aria-describedby="email-error" />
          <span class="texto-error-campo" id="email-error"></span>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="input-con-boton">
            <input class="input" type="password" id="password" name="password" autocomplete="current-password"
                   placeholder="••••••••" required aria-describedby="password-error" />
            <button type="button" class="btn-ver-password" id="btn-ver-password"
                    aria-label="Mostrar contraseña" aria-pressed="false">
              <!-- Ojo abierto -->
              <svg id="icono-ver" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />
              </svg>
              <!-- Ojo tachado -->
              <svg id="icono-ocultar" class="oculto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22" />
              </svg>
            </button>
          </div>
          <span class="texto-error-campo" id="password-error"></span>
        </div>

        <button type="submit" class="btn btn-primario" id="btn-login">
          <span class="spinner oculto" id="login-spinner" aria-hidden="true"></span>
          <span id="login-texto">Ingresar</span>
        </button>

        <p class="login-aviso oculto" id="aviso-servidor" role="status">
          Conectando con el servidor… la primera vez puede tardar hasta un minuto.
        </p>
      </form>
    </section>

    <p class="login-pie">© 2026 SegurIA-LPR · Proyecto Capstone Duoc UC</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
